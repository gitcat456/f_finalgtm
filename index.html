    <style>
      @keyframes htmlShimmer {
        0% {
          background-position: -200% 0;
        }

        100% {
          background-position: 200% 0;
        }
      }

      .html-skel {
        background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
        background-size: 200% 100%;
        animation: htmlShimmer 1.5s infinite;
        border-radius: 8px;
      }
    </style>
